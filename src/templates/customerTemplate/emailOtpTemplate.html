<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PAN Journey OTP</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f6fb;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table width="100%" bgcolor="#f4f6fb" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <!-- Main Card -->
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              margin-top: 40px;
              border-radius: 10px;
              overflow: hidden;
              box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: #0d6efd;
                  padding: 20px;
                  text-align: center;
                  color: #fff;
                "
              >
                <h1 style="margin: 0">Pan Journey</h1>
                <p style="margin: 0; font-size: 14px">
                  Travel Smart • Travel Easy
                </p>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 40px; text-align: center">
                <h2 style="margin-top: 0">Verify your email</h2>
                <p style="color: #555; font-size: 16px">
                  Use the OTP below to continue your login.
                </p>

                <!-- OTP BOX -->
                <div
                  style="
                    font-size: 32px;
                    letter-spacing: 6px;
                    background: #f1f3f9;
                    display: inline-block;
                    padding: 15px 30px;
                    border-radius: 8px;
                    margin: 20px 0;
                    font-weight: bold;
                  "
                >
                  {{OTP}}
                </div>

                <p style="color: #888; font-size: 14px">
                  This OTP is valid for <b>5 minutes</b>.
                </p>

                <p style="color: #999; font-size: 13px; margin-top: 30px">
                  If you didn’t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  background: #f7f7f7;
                  padding: 20px;
                  text-align: center;
                  font-size: 12px;
                  color: #999;
                "
              >
                © 2026 PAN Journey • All rights reserved
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
