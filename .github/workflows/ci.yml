name: Backend CI/CD

on:
  pull_request:
    branches:
      - develop
      - uat
      - main

  push:
    branches:
      - develop
      - uat
      - main

jobs:
  # ============================================================
  # CI - Runs for PRs and pushes to develop, uat and main
  # ============================================================
  ci:
    name: Backend CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

  # ============================================================
  # DEV CD - Only runs after successful push to develop
  # ============================================================
  deploy-dev:
    name: Deploy Backend to DEV
    runs-on: ubuntu-latest

    # Wait for CI to complete successfully
    needs: ci

    # Deploy ONLY when code is pushed directly to develop.
    # Pull requests will NOT trigger deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      id-token: write

    steps:
      # --------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::056580203067:role/GitHubActions-Destinoway-Dev-Deploy
          aws-region: ap-south-1

      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Deploy to DEV EC2 using AWS Systems Manager
      # --------------------------------------------------------
      - name: Deploy to DEV EC2 via SSM
        shell: bash
        run: |
          set -e

          echo "Starting DEV deployment..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-070f25a421e2d336c" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Destinoway backend DEV from develop" \
            --parameters 'commands=[
              "set -e",
              "echo \"Starting deployment on DEV EC2...\"",
              "cd /home/ubuntu/apps/destinoway-backend",
              "echo \"Fetching latest develop branch...\"",
              "git fetch origin develop",
              "echo \"Resetting working tree to origin/develop...\"",
              "git reset --hard origin/develop",
              "echo \"Installing dependencies...\"",
              "npm ci",
              "echo \"Restarting PM2 application...\"",
              "pm2 restart destinoway-backend",
              "pm2 save",
              "echo \"Checking PM2 status...\"",
              "pm2 status",
              "echo \"Deployment completed successfully.\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-070f25a421e2d336c"

          echo "DEV deployment completed successfully."

          echo "Deployment output:"
          echo "----------------------------------------"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-070f25a421e2d336c" \
            --query '{
              Status: Status,
              StandardOutput: StandardOutputContent,
              StandardError: StandardErrorContent
            }' \
            --output json

          echo "----------------------------------------"
          echo "DEV deployment finished."
