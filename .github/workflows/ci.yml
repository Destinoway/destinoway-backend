name: Backend CI/CD

on:
  pull_request:
    branches:
      - develop
      - uat
      - main

  push:
    branches:
      - develop
      - uat
      - main

jobs:
  # ============================================================
  # CI
  # Runs for PRs and pushes to develop, uat and main
  # ============================================================
  ci:
    name: Backend CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build


  # ============================================================
  # DEV CD
  # Runs only after successful push to develop
  # ============================================================
  deploy-dev:
    name: Deploy Backend to DEV
    runs-on: ubuntu-latest

    # Wait for CI to finish successfully
    needs: ci

    # Deploy only for push to develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      id-token: write

    steps:
      # --------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::056580203067:role/GitHubActions-Destinoway-Dev-Deploy
          aws-region: ap-south-1

      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Prepare deployment script
      # --------------------------------------------------------
      - name: Prepare DEV deployment script
        shell: bash
        run: |
          cat > deploy-dev.sh <<'EOF'
          #!/bin/bash

          set -e

          echo "========================================"
          echo "Starting Destinoway DEV deployment"
          echo "========================================"

          APP_DIR="/home/ubuntu/apps/destinoway-backend"

          echo "Application directory:"
          echo "$APP_DIR"

          cd "$APP_DIR"

          echo ""
          echo "Current Git status:"
          git status

          echo ""
          echo "Fetching latest develop branch..."
          git fetch origin develop

          echo ""
          echo "Resetting working tree to origin/develop..."
          git reset --hard origin/develop

          echo ""
          echo "Installing dependencies..."
          npm ci

          echo ""
          echo "Restarting PM2 application..."
          pm2 restart destinoway-backend

          echo ""
          echo "Saving PM2 configuration..."
          pm2 save

          echo ""
          echo "PM2 status:"
          pm2 status

          echo ""
          echo "Checking application logs..."
          pm2 logs destinoway-backend --lines 20 --nostream

          echo ""
          echo "========================================"
          echo "DEV deployment completed successfully"
          echo "========================================"
          EOF

          chmod +x deploy-dev.sh

          echo "Deployment script prepared."

      # --------------------------------------------------------
      # Encode deployment script
      # --------------------------------------------------------
      - name: Encode deployment script
        shell: bash
        run: |
          DEPLOY_SCRIPT_BASE64=$(base64 -w 0 deploy-dev.sh)

          echo "DEPLOY_SCRIPT_BASE64=$DEPLOY_SCRIPT_BASE64" >> "$GITHUB_ENV"

          echo "Deployment script encoded successfully."

      # --------------------------------------------------------
      # Send deployment command to DEV EC2
      # --------------------------------------------------------
      - name: Deploy to DEV EC2 via SSM
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Sending deployment command to DEV EC2"
          echo "========================================"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-070f25a421e2d336c" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Destinoway backend DEV from develop" \
            --parameters "commands=[\"echo '$DEPLOY_SCRIPT_BASE64' | base64 -d | sudo -iu ubuntu bash\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo ""
          echo "Waiting for deployment to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-070f25a421e2d336c"

          echo ""
          echo "========================================"
          echo "DEV deployment completed"
          echo "========================================"

          echo ""
          echo "Deployment output:"
          echo "----------------------------------------"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-070f25a421e2d336c" \
            --query '{
              Status: Status,
              StandardOutput: StandardOutputContent,
              StandardError: StandardErrorContent
            }' \
            --output json

          echo "----------------------------------------"

      # --------------------------------------------------------
      # Final verification
      # --------------------------------------------------------
      - name: Verify DEV deployment
        shell: bash
        run: |
          echo "DEV deployment workflow finished successfully."