name: Backend CI/CD

on:
  pull_request:
    branches:
      - develop
      - uat
      - main

  push:
    branches:
      - develop
      - uat
      - main

jobs:
  # ==========================================
  # CI - Runs for PRs and pushes
  # ==========================================
  ci:
    name: Backend CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Validate project
        run: npm run build

  # ==========================================
  # UAT CD - Deploy only after push to uat
  # ==========================================
  deploy-uat:
    name: Deploy Backend to UAT
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_UAT_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Prepare UAT deployment script
        shell: bash
        run: |
          cat > deploy-uat.sh <<'EOF'
          #!/bin/bash
          set -e

          APP_DIR="/home/ubuntu/apps/destinoway-backend"

          echo "Starting Destinoway UAT deployment"

          cd "$APP_DIR"

          echo "Fetching latest UAT code..."
          git fetch origin uat

          echo "Updating UAT working tree..."
          git reset --hard origin/uat

          echo "Installing production dependencies..."
          npm ci --omit=dev

          echo "Restarting UAT PM2 application..."
          pm2 restart destinoway-uat-api

          echo "Saving PM2 configuration..."
          pm2 save

          echo "Checking PM2 status..."
          pm2 status

          echo "Checking recent application logs..."
          pm2 logs destinoway-uat-api --lines 30 --nostream

          echo "UAT deployment completed"
          EOF

      - name: Encode deployment script
        shell: bash
        run: |
          DEPLOY_SCRIPT_BASE64=$(base64 -w 0 deploy-uat.sh)
          echo "DEPLOY_SCRIPT_BASE64=$DEPLOY_SCRIPT_BASE64" >> "$GITHUB_ENV"

      - name: Deploy to UAT EC2 via SSM
        shell: bash
        run: |
          set -e

          INSTANCE_ID="i-04c47e99b900f38e0"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Destinoway backend UAT from uat branch" \
            --parameters "commands=[\"echo '$DEPLOY_SCRIPT_BASE64' | base64 -d | sudo -iu ubuntu bash\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for UAT deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Deployment output:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status: Status,
              StandardOutput: StandardOutputContent,
              StandardError: StandardErrorContent
            }' \
            --output json

      - name: UAT deployment completed
        run: echo "Destinoway UAT deployment workflow finished."
